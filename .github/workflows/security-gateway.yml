# Security Gateway — шаг 8: политика безопасности (раздел 5)
#
# Стартует ПОСЛЕ завершения Security Checks (workflow_run).
# Скачивает артефакты SAST / DAST / Security Checks по commit SHA,
# применяет политику (scripts/security-gateway.py), комментирует PR.
#
# BLOCK (мягкий режим): Gitleaks >= 1, Semgrep ERROR >= 1
# STRICT=1 в job env: дополнительно BLOCK при Trivy CRITICAL / npm critical

name: Security Gateway

on:
  workflow_run:
    workflows:
      - "Security Checks — Gitleaks, Trivy, npm audit"
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  security-gateway:
    name: Security Gateway
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion != 'cancelled'
    steps:
      - name: Скачать код (скрипт политики)
        uses: actions/checkout@v4

      - name: Commit SHA прогона
        id: sha
        run: echo "value=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Скачать artifact semgrep-backend
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: sast.yml
          commit: ${{ steps.sha.outputs.value }}
          name: semgrep-backend
          path: reports/sast

      - name: Скачать artifact semgrep-frontend
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: sast.yml
          commit: ${{ steps.sha.outputs.value }}
          name: semgrep-frontend
          path: reports/sast

      - name: Скачать artifact zap-reports
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: dast.yml
          commit: ${{ steps.sha.outputs.value }}
          name: zap-reports
          path: reports/dast

      - name: Скачать artifact gitleaks-report
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: security-checks.yml
          commit: ${{ steps.sha.outputs.value }}
          name: gitleaks-report
          path: reports/gitleaks

      - name: Скачать artifact trivy-images
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: security-checks.yml
          commit: ${{ steps.sha.outputs.value }}
          name: trivy-images
          path: reports/trivy-images

      - name: Скачать artifact npm-audit-report
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: security-checks.yml
          commit: ${{ steps.sha.outputs.value }}
          name: npm-audit-report
          path: reports/npm

      - name: Список скачанных отчётов
        run: find reports -type f 2>/dev/null | sort || echo "reports/ пуст"

      - name: Проверить политику (п. 5.2)
        id: policy
        env:
          REPORTS_DIR: reports
          GATEWAY_SHA: ${{ steps.sha.outputs.value }}
          STRICT: "1"
        run: |
          set +e
          set -o pipefail
          python3 scripts/security-gateway.py | tee gateway-log.txt
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Сохранить сводку Gateway
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-gateway-report
          path: |
            gateway-report.md
            gateway-result.json
            gateway-log.txt
          if-no-files-found: warn

      - name: Комментарий в Pull Request
        if: always() && hashFiles('gateway-report.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('gateway-report.md', 'utf8');
            const marker = '<!-- security-gateway -->';
            const fullBody = marker + '\n' + body;

            const prs = context.payload.workflow_run.pull_requests || [];
            if (prs.length === 0) {
              core.info('Push без PR — комментарий пропущен. Сводка в Artifacts → security-gateway-report.');
              return;
            }
            const prNumber = prs[0].number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: fullBody,
              });
            }

      - name: Итог — BLOCK или PASS
        if: steps.policy.outputs.exit == '1'
        run: |
          echo "Security Gateway: BLOCK — см. gateway-report.md и Artifacts"
          exit 1
