# CI — сборка Docker и публикация в GHCR
# GHCR = GitHub Container Registry = ghcr.io — «склад» Docker-образов
#
# Секрет GitHub: GHCR_TOKEN (PAT с правами repo, workflow, write:packages)

name: CI — Docker build & GHCR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-backend:
    name: Backend — сборка и GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Собрать и опубликовать backend
        uses: docker/build-push-action@v6
        with:
          context: ./necommerce-backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/necommerce-backend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/necommerce-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Frontend — сборка и GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login в GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Собрать и опубликовать frontend
        uses: docker/build-push-action@v6
        with:
          context: ./necommerce-frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/necommerce-frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/necommerce-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
